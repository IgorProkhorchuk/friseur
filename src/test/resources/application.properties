spring.application.name=friseur-test

spring.datasource.url=jdbc:h2:mem:friseur-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

server.port=0
logging.file.name=target/test-logs/application.log

server.servlet.session.cookie.secure=false
security.remember-me.key=test-remember-me-key
security.remember-me.token-validity-seconds=2592000
security.remember-me.secure-cookie=false
