spring.application.name=friseur-test

spring.datasource.url=jdbc:h2:mem:friseur-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

server.port=0
logging.file.name=target/test-logs/application.log

security.jwt.secret=MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=
security.jwt.access-token-ttl=PT30M
security.jwt.refresh-token-ttl=P7D
security.jwt.remember-me-refresh-token-ttl=P100D
security.jwt.issuer=friseur-test
security.jwt.secure-cookie=false
security.jwt.same-site=Lax
