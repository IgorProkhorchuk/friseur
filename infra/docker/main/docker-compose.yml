services:
  postgres:
    image: postgres:16
    container_name: friseur_prod_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - friseur_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ${APP_BUILD_CONTEXT:-../../..}
      dockerfile: ${APP_DOCKERFILE:-infra/docker/app/Dockerfile}
      target: ${APP_BUILD_TARGET:-runtime-from-source}
    container_name: friseur_prod_app
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:?REMEMBER_ME_KEY is required}
      REMEMBER_ME_SECURE_COOKIE: ${REMEMBER_ME_SECURE_COOKIE:-true}
      REMEMBER_ME_TOKEN_VALIDITY_SECONDS: ${REMEMBER_ME_TOKEN_VALIDITY_SECONDS:-2592000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - friseur_net
    volumes:
      - /var/log/friseur-prod:/var/log/friseur

volumes:
  pgdata_prod:

networks:
  friseur_net:

